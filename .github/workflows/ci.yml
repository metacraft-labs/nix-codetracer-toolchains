name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
      - dev
      - stable
  pull_request:
    branches:
      - main
      - dev
      - stable

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-lint.yml@dev
    secrets:
      NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
  ci:
    uses: metacraft-labs/devops-modules/.github/workflows/reusable-flake-checks-ci-matrix.yml@dev
    secrets:
      NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
      # The private Attic cache (vars.SUBSTITUTERS). Without a credential the
      # ephemeral Linux runners drop it after a 401 preflight, and nothing
      # this repo builds is ever uploaded, so every lock bump rebuilds the
      # darwin GCC 13 / GNAT bootstrap from source (55 min to over 3.5 h per
      # job on the macOS pool, 2026-10/11 runs). The reusable workflow reads
      # with ATTIC_PULL_TOKEN, falls back to ATTIC_TOKEN, and uploads only
      # with ATTIC_TOKEN.
      ATTIC_PULL_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
    with:
      # Upload successful build outputs only from a push to a mainline, i.e.
      # code that already landed. Pull-request and merge-queue runs build code
      # that has not landed, and must not write to a cache other runs trust.
      push-check-caches: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable') && 'true' || 'false' }}
      runners: | # json
        {
          "x86_64-linux": [
            "self-hosted", "linux", "x64"
          ],
          "aarch64-darwin": [
            "self-hosted", "macos", "arm64"
          ]
        }
